[shellbox]
user = www-data
group = www-data
listen = /run/php/shellbox.sock
listen.owner = _daemon_
listen.group = _daemon_
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 500
pm.status_path = /status
request_terminate_timeout = 180s
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
process.dumpable = no
security.limit_extensions = .php
php_admin_value[sys_temp_dir] = /tmp/shellbox
php_admin_value[upload_tmp_dir] = /tmp/shellbox
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
