# Apache runs as _daemon_ and cannot reopen Pebble's root-owned stdout pipe through
# /dev/stdout, so piped loggers write to the stdout they inherit instead.
ErrorLog "||/bin/cat"

<VirtualHost 127.0.0.1:8080>
    ServerName shellbox.internal
    DocumentRoot /srv/shellbox/public_html
    Alias /shellbox /srv/shellbox/public_html/shellbox.php

    <Directory /srv/shellbox/public_html>
        Require all granted
    </Directory>

    <FilesMatch ".+\.php$">
        SetHandler "proxy:unix:/run/php/shellbox.sock|fcgi://localhost"
    </FilesMatch>

    RewriteEngine On
    RewriteCond %{HTTP:Authorization} ^(.*)
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%1]

    CustomLog "||/bin/cat" combined
</VirtualHost>

# Commands share the pod's loopback, so only the machine-readable output, which has aggregate
# counters, is served. The HTML page shows the request lines of other requests.
<VirtualHost 127.0.0.1:8091>
    ServerName shellbox-status.internal

    <Location /server-status>
        SetHandler server-status
        Require local
        <If "%{QUERY_STRING} != 'auto'">
            Require all denied
        </If>
    </Location>
</VirtualHost>
