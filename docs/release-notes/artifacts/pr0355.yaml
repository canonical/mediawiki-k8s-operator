changes:
  - title: Renamed the tracing relation to workload-tracing
    author: hk21702
    type: breaking
    description: >-
      Renamed the optional tracing relation from ``tracing`` to
      ``workload-tracing`` to distinguish workload tracing from future
      charm-level tracing. Integrations using the old endpoint must be updated
      to use ``workload-tracing``.
