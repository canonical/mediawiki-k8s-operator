changes:
  - title: Fixed S3 uploads through egress proxies
    author: hk21702
    type: bugfix
    description: >
      S3 uploads now respect the configured egress proxy throughout the
      transfer, allowing MediaWiki deployments that use a proxy to upload
      media to S3 reliably.
