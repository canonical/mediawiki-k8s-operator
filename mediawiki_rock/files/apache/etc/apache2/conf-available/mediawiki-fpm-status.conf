Listen 127.0.0.1:8091

<VirtualHost 127.0.0.1:8091>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/php-fpm-status$ - [END]
    <Location "/">
        Require all denied
    </Location>
    <LocationMatch "^/php-fpm-status$">
        Require local
        SetHandler "proxy:unix:/run/php/mediawiki.sock|fcgi://localhost/"
    </LocationMatch>
</VirtualHost>