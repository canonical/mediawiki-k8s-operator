Listen 8091

<VirtualHost *:8091>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/php-fpm-status$ - [END]
    <Location "/">
        Require all denied
    </Location>
    <LocationMatch "^/php-fpm-status$">
        Require all granted
        SetHandler "proxy:unix:/run/php/mediawiki.sock|fcgi://localhost/"
    </LocationMatch>
</VirtualHost>