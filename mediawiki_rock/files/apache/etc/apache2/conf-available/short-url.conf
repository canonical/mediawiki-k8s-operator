# Serve SimpleSAMLphp directly
Alias /w/simplesaml /usr/share/simplesamlphp/www

<Directory /usr/share/simplesamlphp/www>
  Options FollowSymLinks
  AllowOverride None
  Require all granted
</Directory>

<Directory /var/www/html>
  RewriteEngine On

  # Redirect / to Main Page
  RewriteRule ^/*$ %{DOCUMENT_ROOT}/w/index.php [L]

  # Redirect all requests that are not for an existing file or directory to index.php
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^ %{DOCUMENT_ROOT}/w/index.php [L]
</Directory>
