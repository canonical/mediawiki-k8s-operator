<FilesMatch \.php$>
	# mod_proxy_fcgi drops the Authorization header unless explicitly passed to PHP.
	CGIPassAuth On
	SetHandler "proxy:unix:/run/php/mediawiki.sock|fcgi://localhost/"
</FilesMatch>

DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory /var/www/>
	Options -Indexes
	AllowOverride All
	# To allow apache's server-status route to be handled by apache rather than being forwarded
	# to MediaWiki server. Required for prometheus integration.
	RewriteCond %{REQUEST_URI} !server-status
	RewriteRule . /index.php [L]
</Directory>
