# Serve Apache's status page to the Prometheus exporter on a dedicated loopback listener.
# Containers in the pod share a network namespace, so any of them can reach this listener.
Listen 127.0.0.1:8090

<VirtualHost 127.0.0.1:8090>
	<Location "/server-status">
		# Skip the webroot's per-directory rewrites to index.php.
		RewriteEngine Off
		SetHandler server-status
		Require local
		# The machine-readable output has only aggregate counters; the HTML page shows request lines.
		<If "%{QUERY_STRING} != 'auto'">
			Require all denied
		</If>
	</Location>
</VirtualHost>
